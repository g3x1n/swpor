# 本机演示阶段只验证 macOS arm64（SPEC 2.1）。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: macos-arm64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install dependencies (macOS, Homebrew)
        run: brew install openssl@3 cmocka isa-l

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

      - name: Dependency self-check
        run: ./build/debug/apps/porctl doctor
